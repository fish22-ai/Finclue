# Career Intelligence — 运行配置
# 最后更新：2026-09-12
# 说明：本文件只描述"抓什么、怎么跑"，不含业务逻辑。
#       所有可用性标注均来自 2026-09-12 实测，见 docs/环境与数据源实测报告.md

runtime:
  timezone: Asia/Shanghai
  output_dir: ./data
  raw_dir: ./data/raw
  state_file: ./data/seen_urls.jsonl   # 幂等：记录已处理 URL 的 hash
  log_dir: ./data/logs
  request_timeout: 20
  retry: 2
  retry_backoff_seconds: 5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# ---------------------------------------------------------------
# AI 上游
# ---------------------------------------------------------------
llm:
  provider: agentrouter            # 第三方中转，见 docs/ADR/0002
  base_url: https://agentrouter.org/v1
  # 凭据存放于 ~/.cc-switch/cc-switch.db -> providers.settings_config.env.ANTHROPIC_AUTH_TOKEN
  # 不落盘到本仓库
  credential_source: cc-switch-db
  model: deepseek-v4-flash
  # 该上游是推理模型，响应含 reasoning_content，会吃掉 max_tokens 预算
  # extract 给 8192：LinkedIn JD 正文较长，4096 会撞 finish_reason=length
  max_tokens:
    extract: 8192
    insight: 8192
  temperature:
    extract: 0
    insight: 0.3
  # 必须伪造 Claude Code 客户端指纹，否则返回 unauthorized client detected
  required_headers:
    user-agent: "claude-cli/2.0.0 (external, cli)"
    anthropic-version: "2023-06-01"
    anthropic-beta: "claude-code-20250219"
  cost_per_call_usd_estimate: 0.015

# ---------------------------------------------------------------
# 数据源
# 每类适配器：rss | json_api | html
# enabled: 是否纳入 MVP 首轮
# status: verified=已实测可用 / blocked=已实测不可用(勿重试) / todo=待验证
# ---------------------------------------------------------------
sources:

  # --- 小红书（经 socai）：中文一手求职经历主力来源 ---
  # socai 以本人账号 + 受管浏览器抓公开帖子，是唯一能填 actual_bar /
  # return_offer / wlb 的源。裸 curl 会撞 302 登录墙，必须走 socai。
  xhs_socai:
    adapter: socai
    enabled: true
    status: verified
    binary: "C:/Users/吃鱿鱼的鱿鱼/.socai/bin/socai.exe"
    # 两阶段：先 search --preview 拿卡片（便宜），再 get-notes 取正文
    #
    # 抓取取向（2026-09-29 按用户要求调整）：
    #   主线 = **正职体验**（在职的人讲真实状态：WLB / 强度 / 待遇 / 日常）
    #   次要 = 求职入口（秋招、实习留用）—— 用户原话「实习无所谓」，只留 2 条
    #   降权 = 量化，只留 1 条 —— 用户自评「量化大概率进不去」
    queries:
      # --- 正职体验（主线，5 条）---
      - "券商 工作体验"
      - "投行 打工日常"
      - "行研 从业 真实感受"
      - "金融 打工人 日常"
      - "券商 加班 强度"
      # --- 求职入口（次要，2 条）---
      - "金融 秋招"
      - "券商 实习 留用"
      # --- 量化（降权，1 条，偏正职而非实习）---
      - "量化 工作体验"
    # --- 定向博主（2026-09-29 加）-------------------------------------
    # 用户点名的账号：每轮必抓、选帖优先，且**不参与**「池子够用就跳过搜索」
    # 那套优化（否则池子一满，人家新发的笔记要等 TTL 过期才可能进来）。
    #
    # ⚠️ id 必须取主页 URL 里 /user/profile/<id> 的尾段（24 位 hex），
    #    **不是**主页上显示的「小红书号」—— 直接拿小红书号当 id 请求，
    #    socai 会返回 ok=true 但 profile 全空的**假成功**（2026-09-29 实测，
    #    eco413 / 49628490145 都踩过）。定位 user id 的办法：
    #    搜「<小红书号>」这个关键词，结果页的用户卡片会写「小红书号：xxx」
    #    （在 page_ocr_text 里），同一份结果里对应卡片的 author_id 就是它。
    #    这两个号就是这么认出来的。
    authors:
      - id: "583afd8d50c4b42ea3ec7400"
        name: "金融老兵（小红书号 eco413｜证券从业｜1.3万粉｜北京）"
      - id: "68661d35000000001b023b26"
        name: "固收民间科学家（小红书号 49628490145｜固收·银行·资管｜香港）"
      # --- 2026-09-30 用户新增第二批（scripts/resolve_authors.py 自动解析，
      #     每个都用 socai xhs author 验证过 xhs_id 字段，不是假成功）---
      - id: "60fac8aa000000000101d79f"
        name: "商科求职观察员（小红书号 guanchayuan7｜Top PE 在职｜1.6万粉｜上海）"
      - id: "64b17792000000001001c3c4"
        name: "水冘（小红书号 8939926004｜收集 CFA 笔记类，供日常复习金融知识｜北京）"
      - id: "5f99af23000000000100776e"
        name: "半坏街灯（小红书号 1060654173｜CUFE本·HKU硕｜央企总/泛体制/投研｜上海）"
      - id: "59316d7e5e87e741e18a6b47"
        name: "海淀小厉旬（小红书号 600805759｜职场博主｜6355粉｜北京）"
      - id: "62c50f97000000001902a606"
        name: "日月有双（按昵称解析｜BA & Finance·港本｜2608粉）"
      # ⚠️ 63804271801 两次搜索都没定位到用户（2026-09-30，候选全是无关小号），
      #    疑似号码抄错 —— 待用户提供昵称或核对号码后补入。
    author_num_notes: 60        # 每个主页滚动收集多少张卡（实测约 0.5s/张）
    author_pick: 12             # 每轮优先从定向博主的未抓卡里抽几条；不足则用关键词卡补满
                                #   2026-09-30 8→12：用户要求「尽量按特定人来，不要按搜索词来」

    filters:
      # ⚠️ publish_time 只接受：一天内 / 一周内 / 半年内
      #    传别的值（如「三个月内」）会导致 search_failed 返回 0 张卡片
      publish_time: "半年内"
      # 直接排除视频笔记：视频没有图，--ocr 拿不到内容，正文往往只有一句标题
      note_type: "图文"
    num_notes_per_query: 30        # 卡片数
    num_comments: 10               # 每篇取多少评论（评论常含一手补充信息；2026-09-30 8→10，用户点名要评论区）
    ocr: true                      # 必须开：金融内容大量在图片里（JD 截图、岗位表）
    # 选帖规则：按点赞排序取 Top N 高赞池 → 池中随机抽 M 篇（不直接取 Top M）
    high_like_pool: 40             # 池子要明显大于 posts_to_fetch，否则等于没随机
    posts_to_fetch: 15             # 每轮取多少篇正文（实测每篇约 40-60s，含 OCR）
    rate_limit_seconds: 20         # 抓取放缓，不并发，避免触发风控
    timeout_seconds: 900           # socai 单次调用可能很慢（OCR + 打开笔记）

    # --- 候选池复用（2026-09-18 加）-----------------------------------
    # 搜索阶段要把 8 个词各跑一遍（每轮 socai ~70s + 20s 限速 ≈ 90s，整段约 12min），
    # 只为建一个池子抽出 15 篇正文。而搜索卡片里的 xsec_token 是可以跨天复用的：
    # 2026-09-18 实测，09-13（5 天前）那份 artifact 里的 token 仍能正常取到正文。
    # 所以池子落盘到 data/pool/xhs.json，未抓过的卡够多时整段跳过搜索。
    #
    # ⚠️ 这个值必须大于「两次运行之间的间隔」，否则池子每次都被判定过期、白建。
    #    定时任务是每 3 天跑一次（scripts\install_task.ps1），所以取 4 而不是 3：
    #    池子在 D0 10:12 写入，D3 10:00 再跑时距写入已 ≥3 天，用 3 会被判过期。
    #    取 4 的效果是「每 2 次运行重搜一次」，卡内 token 最多 3 天龄，
    #    距实测的安全边界（5 天）留 2 天余量。
    pool_ttl_days: 4
    pool_min_fresh: 30             # 未抓过的卡低于此值才重新搜索；够多就跳过
    pool_max_fails: 2              # 同一张卡连续取正文失败几次后不再抽它（防僵尸卡空转）

  # --- Reddit RSS：英文一手求职经历 ---
  # 注意：JSON API 被封(403)，RSS 端点可用。不要改用 /new.json
  reddit_rss:
    adapter: rss
    enabled: false            # 用户要求：只做小红书（2026-09-13）
    status: verified
    url_template: "https://www.reddit.com/r/{sub}/.rss"
    subs:
      - FinancialCareers      # 金融求职主阵地（实测 25 条/次）
      - quant                 # 量化
      - cscareerquestions     # 科技/金科，含少量 quant 岗
      - FinancialEngineering  # 金融工程，与量化互补
    # 注意：subreddit 名大小写不敏感，FinancialCareers 与 financialcareers 是同一个版块
    rate_limit_seconds: 15     # 实测 5s 会撞 429，放宽到 15s
    max_items_per_run: 25

  # --- LinkedIn 公开岗位：JD 侧最高质量来源 ---
  # 无需登录，返回结构化 HTML 卡片，每页 10 条
  linkedin_jobs:
    adapter: json_api          # HTML 卡片解析，但结构稳定
    enabled: false             # 用户要求：不要抓 LinkedIn（2026-09-13）
    status: verified
    url_template: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords={keywords}&location={location}&start={start}"
    queries:
      - keywords: "investment banking"
        location: "Hong Kong"
      - keywords: "equity research"
        location: "Hong Kong"
      - keywords: "private equity"
        location: "Hong Kong"
      - keywords: "quantitative research"
        location: "Hong Kong"
    pages_per_query: 2         # start=0,10
    # 卡片只有 标题/公司/地点，没有 JD 正文 —— 必须拉详情才能填 recruiting_bar
    fetch_details: true
    max_details: 30            # 控制详情请求量；优先拉非资深岗
    rate_limit_seconds: 3

  # --- eFinancialCareers：金融垂直招聘 ---
  efinancialcareers:
    adapter: html
    enabled: false             # 结构解析待做，MVP 第二轮
    status: verified
    urls:
      - "https://www.efinancialcareers.com"
      - "https://www.efinancialcareers.cn"
    selector_hint: "a[href^='/jobs/']"

  # --- Bing 搜索：泛化补源 ---
  # 结果走 r.bing.com/ck/a?...&u=a1<base64> 跳转，需要解码
  bing_search:
    adapter: html
    enabled: false             # MVP 第二轮；首轮先跑通结构化源
    status: verified
    url_template: "https://www.bing.com/search?q={query}&setlang=zh-CN"
    queries:
      - "券商 行研 实习 面经"
      - "投行 暑期实习 offer 分享"
      - "PE VC 实习 面试经验"
    rate_limit_seconds: 10

  # --- 以下为已实测不可用，仅作记录，不要启用 ---
  # 注意：小红书不在此列 —— 裸 curl 撞登录墙，但 socai 能抓，见上 xhs_socai
  _blocked:
    - name: reddit_json_api
      status: blocked
      reason: "403 Forbidden（RSS 端点可用，见 reddit_rss）"
    - name: 1point3acres
      status: blocked
      reason: "403 Cloudflare 'Just a moment...'"
    - name: wallstreetoasis
      status: blocked
      reason: "403 Cloudflare 'Just a moment...'"
    - name: zhihu
      status: blocked
      reason: "403 / 302 登录墙"
    - name: glassdoor
      status: blocked
      reason: "403"
    - name: indeed
      status: blocked
      reason: "403"
    - name: liepin
      status: blocked
      reason: "000 无法连接"
    - name: nowcoder_api
      status: blocked
      reason: "返回 HTML 壳，非真 API，需逆向真实 XHR"
    - name: rsshub
      status: blocked
      reason: "403"

# ---------------------------------------------------------------
# 过滤
# ---------------------------------------------------------------
filter:
  # 相关性关键词（命中任一即通过初筛）
  # 2026-09-29：补入「正职体验」类词。原来清一色是实习/校招入口词，
  # 在职员工讲工作状态的笔记容易被判 irrelevant（虽然 institution_keywords
  # 能兜住，但那层只看机构名，不看"在讲什么"）。
  relevance_keywords:
    # --- 求职入口 ---
    - 实习
    - 校招
    - 暑期
    - 秋招
    - 春招
    - 面经
    - 面试
    - offer
    - 留用
    - 转正
    - intern
    - internship
    - summer
    - graduate
    - return offer
    - interview
    # --- 正职体验（2026-09-29 加）---
    - 工作体验
    - 打工
    - 加班
    - 强度
    - 待遇
    - 薪酬
    - 薪资
    - 离职
    - 跳槽
    - 晋升
    - 职级
    - 从业
    - WLB
    - analyst
    - salary
    - compensation
    # --- 金融知识笔记（2026-09-30 加）---
    # 用户加了 CFA 笔记类博主，这类内容是「日常复习」用的，
    # 原词表全是求职词，会把它们全判成 irrelevant 扔掉。
    - CFA
    - FRM
    - CPA
    - 笔记
    - 金融知识
    - 备考
    - 考证
    - 复习
  # 机构筛选范围
  institution_keywords:
    - 券商
    - 投行
    - 行研
    - PE
    - VC
    - 公募
    - 私募
    - 资管
    - 银行
    - 信托
    - 保险
    - 量化
    - 金科
    - 财资
    - 风控
    - 财会
    - securities
    - investment bank
    - asset management
    - hedge fund
  # 噪音黑名单（命中即丢弃）
  blocklist_keywords:
    - 付费咨询
    - 简历修改
    - 内推码
    - 加微信
    - 课程报名
    - 限时优惠
    - 扫码进群
    - "DM me"
    - "link in bio"
  # 最短正文长度，低于此值直接丢弃
  min_content_length: 120
  # 是否调用 LLM 做二次价值判断（成本换质量）
  llm_value_check: false

# ---------------------------------------------------------------
# 去重
# ---------------------------------------------------------------
dedup:
  # 一级：URL 归一化后精确匹配（去 query/fragment/utm）
  url_normalize: true
  # 二级：标题 SimHash 近似匹配
  title_simhash: true
  simhash_threshold: 3
  # 三级：正文前 500 字指纹
  content_fingerprint: true

# ---------------------------------------------------------------
# 洞察分析
# ---------------------------------------------------------------
insight:
  window_days: 30              # 分析窗口
  min_facts_for_pattern: 3     # 低于此值禁止输出 Pattern 层
  min_facts_for_full: 6        # 低于此值禁止输出完整四层
  topics:
    - recruiting_bar
    - wlb
    - salary
    - hc_trend
    - interview
    - return_offer

# ---------------------------------------------------------------
# 飞书多维表
# ---------------------------------------------------------------
feishu:
  base_url: https://open.feishu.cn/open-apis
  # 凭据已存在（8 月 xhs-teardown 项目建立），复用同一个自建应用。
  # 实测 2026-09-13：tenant_access_token code=0，应用已是既有表的协作者。
  credential_file: "D:/xhs-teardown/config/feishu.local.json"
  # 该文件含 app_id / app_secret，权限 600，不入库不外传
  #
  # app_id 已从本文件移除 —— 这个仓库是公开的。
  # 它只是**标识**不是密钥（真正的 app_secret 在上面那个项目外的凭据文件里），
  # 但没必要公开。代码从来不读这一项（feishu.py 的 _creds() 直接从
  # credential_file 取 app_id + app_secret），所以这里留空不影响运行。
  app_id: ""
  # ⚠️ 这些表是 wiki 内嵌多维表：URL 里的 token 是 wiki_token，
  #    不是 app_token。必须先经 wiki API 解析，见 feishu.resolved.json
  wiki_token_cache: "D:/xhs-teardown/config/feishu.resolved.json"
  tables:
    facts:
      # 待用户新建后填入（新建后需把该应用加为协作者，否则 403）
      wiki_url: ""             # 例：https://xxx.feishu.cn/wiki/XXXX?table=tblXXXX
      app_token: ""            # wiki 解析后回填
      table_id: ""
    insights:
      wiki_url: ""
      app_token: ""
      table_id: ""
  # 写入策略
  write:
    # ⚠️ 2026-09-18 起关闭：阅读端改为本地静态站（site/，见 src/render.py），
    #    洞察窗口改读 data/facts/（见 insight.read_facts），飞书降级为**可选镜像**。
    #    代价：关闭期间两张表会出现一段缺口 —— 记录本身不丢，都在 data/pending/，
    #    将来要恢复写入时，那段历史需要单独回填（目前无回填脚本，用户明确「只记档」）。
    #    改回 true 即可恢复推送，代码路径一直保留。
    enabled: false
    batch_size: 50             # 单次 API 调用最多写入条数
    idempotency_key: source_url
    on_conflict: skip          # skip | update
    rate_limit_seconds: 0.5
